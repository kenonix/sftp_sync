name: Rust Core & Hybrid App Build (Experiment)

on:
  push:
    branches: [ "experiment/**" ]
  workflow_dispatch:

jobs:
  build-rust-linux-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Desktop Core
        run: |
          cd rust-core
          cargo build --release

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Build Android Native JNI Libs with cargo-ndk
        run: |
          cd rust-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../composeApp/src/androidMain/jniLibs build --release

      - name: Install Packaging Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg fakeroot

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload Rust Artifacts & Android APK
        uses: actions/upload-artifact@v4
        with:
          name: rust-hybrid-artifacts
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/src/androidMain/jniLibs/**/*.so
            rust-core/target/release/libsftp_sync_core.so
